version: "3.9"
services:
  backend:
    build:
      context: ./backend
    image: nexus-x-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python data_gen.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: python -m http.server 5173
    depends_on:
      - backend
